[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "calculix-fea-examples"
version = "v1.1.1"
description = "Demonstration of CalculiX for various basic finite element analysis simulations"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "matplotlib",
    "pyvista-frd-reader",
]

[project.scripts]
run-all = "run_all:main"
run-example = "run_example:main"
plot-max-ndtemp = "postprocessing_scripts.plot_max_nodal_temp:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["run_all", "run_example"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["postprocessing_scripts*"]